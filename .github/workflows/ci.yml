name: Foundation CI

on:
  push:
    branches:
      - main
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check public source boundary
        run: |
          node --test scripts/validation/public-boundary.test.mjs
          npm run validate:source

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      # This public lane uses synthetic records only. Real source and review data stay private.
      - name: Verify source-answer integrity with synthetic fixtures
        run: npm run test:bank

      - name: Build static output
        run: npm run build

      - name: Verify static output boundary
        run: npm run validate:dist

      - name: Install locked Playwright Chromium
        run: npm exec --offline -- playwright install --with-deps chromium

      - name: Exercise built Pages path
        run: npm run test:pages
